services:

  postgres-controller:
    image: postgres:17-alpine
    container_name: yaadt-postgres-controller
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${YAADT_CONTROLLER_DB_USERNAME:-yaadt}
      POSTGRES_PASSWORD: ${YAADT_CONTROLLER_DB_PASSWORD:-yaadt}
      POSTGRES_DB: ${YAADT_CONTROLLER_DB_NAME:-yaadt_controller}
    volumes:
      - yaadt-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - beads-net

  postgres-temporal:
    image: postgres:17-alpine
    container_name: yaadt-postgres-temporal
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${YAADT_TEMPORAL_DB_USERNAME:-temporal}
      POSTGRES_PASSWORD: ${YAADT_TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_DB: ${YAADT_TEMPORAL_DB_NAME:-temporal}
    volumes:
      - yaadt-temporal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - beads-net

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: yaadt-temporal
    restart: unless-stopped
    depends_on:
      postgres-temporal:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${YAADT_TEMPORAL_DB_USERNAME:-temporal}
      POSTGRES_PWD: ${YAADT_TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_SEEDS: postgres-temporal
      DEFAULT_NAMESPACE: ${YAADT_TEMPORAL_NAMESPACE:-default}
      DEFAULT_TASK_QUEUE: ${YAADT_TEMPORAL_TASK_QUEUE:-yaadt}
      TEMPORAL_ADDRESS: temporal:7233
    networks:
      - beads-net

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: yaadt-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PORT: 8233
    ports:
      - "8233:8233"
    networks:
      - beads-net

  controller-api:
    build:
      context: ./controller
    container_name: yaadt-controller-api
    restart: unless-stopped
    depends_on:
      postgres-controller:
        condition: service_healthy
    environment:
      YAADT_CONTROLLER_DB_URL: jdbc:postgresql://postgres-controller:5432/${YAADT_CONTROLLER_DB_NAME:-yaadt_controller}
      YAADT_CONTROLLER_DB_USERNAME: ${YAADT_CONTROLLER_DB_USERNAME:-yaadt}
      YAADT_CONTROLLER_DB_PASSWORD: ${YAADT_CONTROLLER_DB_PASSWORD:-yaadt}
      YAADT_TEMPORAL_WORKER_ENABLED: "false"
      YAADT_TEMPORAL_TARGET: temporal:7233
      YAADT_TEMPORAL_NAMESPACE: ${YAADT_TEMPORAL_NAMESPACE:-default}
      YAADT_TEMPORAL_TASK_QUEUE: ${YAADT_TEMPORAL_TASK_QUEUE:-yaadt}
      YAADT_SSH_DIRECTORY: /run/yaadt/ssh
      GIT_SSH_COMMAND: "ssh -o IdentityFile=/run/yaadt/ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/run/yaadt/ssh/known_hosts -o StrictHostKeyChecking=yes"
    volumes:
      - ${YAADT_SSH_DIRECTORY:-./.secrets/ssh}:/run/yaadt/ssh:ro
    ports:
      - "${YAADT_CONTROLLER_API_PORT:-8080}:8080"
    networks:
      - beads-net

  controller-worker:
    build:
      context: ./controller
    container_name: yaadt-controller-worker
    restart: unless-stopped
    depends_on:
      postgres-controller:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      YAADT_CONTROLLER_DB_URL: jdbc:postgresql://postgres-controller:5432/${YAADT_CONTROLLER_DB_NAME:-yaadt_controller}
      YAADT_CONTROLLER_DB_USERNAME: ${YAADT_CONTROLLER_DB_USERNAME:-yaadt}
      YAADT_CONTROLLER_DB_PASSWORD: ${YAADT_CONTROLLER_DB_PASSWORD:-yaadt}
      YAADT_TEMPORAL_WORKER_ENABLED: "true"
      YAADT_TEMPORAL_TARGET: temporal:7233
      YAADT_TEMPORAL_NAMESPACE: ${YAADT_TEMPORAL_NAMESPACE:-default}
      YAADT_TEMPORAL_TASK_QUEUE: ${YAADT_TEMPORAL_TASK_QUEUE:-yaadt}
      YAADT_SSH_DIRECTORY: /run/yaadt/ssh
      GIT_SSH_COMMAND: "ssh -o IdentityFile=/run/yaadt/ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/run/yaadt/ssh/known_hosts -o StrictHostKeyChecking=yes"
    volumes:
      - ${YAADT_SSH_DIRECTORY:-./.secrets/ssh}:/run/yaadt/ssh:ro
    networks:
      - beads-net

  controller-dashboard:
    build:
      context: ./controller-dashboard
    container_name: yaadt-controller-dashboard
    restart: unless-stopped
    depends_on:
      - controller-api
    ports:
      - "${YAADT_CONTROLLER_DASHBOARD_PORT:-8090}:80"
    networks:
      - beads-net

  workspace-init:
    image: alpine:3.22
    container_name: beads-workspace-init

    user: "0:0"

    environment:
      USER_UID: ${USER_UID:-1000}
      USER_GID: ${USER_GID:-1000}

    volumes:
      - ./workspace:/workspace

    command:
      - /bin/sh
      - -c
      - |
        echo "Fixing workspace ownership to ${USER_UID}:${USER_GID}"

        chown "${USER_UID}:${USER_GID}" /workspace

        if [ -d /workspace/.beads ]; then
          chown -R "${USER_UID}:${USER_GID}" /workspace/.beads
        fi

        echo "Workspace initialisation complete"

    restart: "no"


  devbox:
    build:
      context: ./devbox
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        NPM_AUDIT_LEVEL: ${NPM_AUDIT_LEVEL:-high}

    depends_on:
      workspace-init:
        condition: service_completed_successfully

    container_name: beads-devbox
    restart: unless-stopped

    working_dir: /workspace

    environment:
      HOME: /home/developer

      BEADS_DIR: /workspace/.beads
      TEAM_RUNS_DIR: /workspace/.team-runs
      TEAM_HEARTBEAT_SECONDS: ${TEAM_HEARTBEAT_SECONDS:-20}
      TEAM_LEASE_SECONDS: ${TEAM_LEASE_SECONDS:-90}
      TEAM_MAX_EVENT_BYTES: ${TEAM_MAX_EVENT_BYTES:-12000}

      LLM_API_KEY: ${LLM_API_KEY:-}

      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Developer}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-developer@local}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-Developer}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-developer@local}

      # Your existing external Gitea
      GITEA_URL: ${GITEA_URL}

      # SSH key used for git access to Gitea.
      #
      # SSH_GITEA_KEY points at the PRIVATE key on the host (default
      # ~/.ssh/gitea). Its .pub half is registered in Gitea. Only this
      # single file is mounted, read-only.
      #
      # "accept-new" pins Gitea's host key on first connect (TOFU);
      # afterwards it is verified from /home/developer/.ssh/known_hosts.
      GIT_SSH_COMMAND: "ssh -i /home/developer/.ssh/gitea -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

    volumes:
      - ./workspace:/workspace
      - ${YAADT_SSH_DIRECTORY:-./.secrets/ssh}:/run/yaadt/ssh:ro
      - ${SSH_GITEA_KEY:-${HOME}/.ssh/gitea}:/home/developer/.ssh/gitea:ro

    tty: true
    stdin_open: true

    command:
      - /bin/bash
      - -lc
      - |
        echo "Development environment ready"
        echo
        echo "Beads:"
        bd version || true
        echo
        echo "Git:"
        git --version
        echo
        echo "Workspace:"
        ls -la /workspace
        exec sleep infinity

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - beads-net

  beads-ui:
    build:
      context: ./beads-ui
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        NPM_AUDIT_LEVEL: ${NPM_AUDIT_LEVEL:-high}
        BEADS_UI_REF: ${BEADS_UI_REF:-main}

    container_name: beads-ui
    restart: unless-stopped

    working_dir: /workspace

    environment:
      HOME: /home/developer
      BEADS_DIR: /workspace/.beads
      TEAM_RUNS_DIR: /workspace/.team-runs
      BD_BIN: /usr/local/bin/bd
      HOST: 0.0.0.0
      PORT: 3007

    ports:
      - "3007:3007"

    volumes:
      - ./workspace:/workspace

    networks:
      - beads-net

volumes:
  dev-home:
  beads-web-home:
  yaadt-postgres-data:
  yaadt-temporal-data:


networks:
  beads-net:
    driver: bridge
