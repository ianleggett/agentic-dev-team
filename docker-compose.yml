services:

  workspace-init:
    image: alpine:3.22
    container_name: beads-workspace-init

    user: "0:0"

    environment:
      USER_UID: ${USER_UID:-1000}
      USER_GID: ${USER_GID:-1000}

    volumes:
      - ./workspace:/workspace

    command:
      - /bin/sh
      - -c
      - |
        echo "Fixing workspace ownership to ${USER_UID}:${USER_GID}"

        chown "${USER_UID}:${USER_GID}" /workspace

        if [ -d /workspace/.beads ]; then
          chown -R "${USER_UID}:${USER_GID}" /workspace/.beads
        fi

        echo "Workspace initialisation complete"

    restart: "no"


  devbox:
    build:
      context: ./devbox
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        NPM_AUDIT_LEVEL: ${NPM_AUDIT_LEVEL:-high}

    depends_on:
      workspace-init:
        condition: service_completed_successfully

    container_name: beads-devbox
    user: "${USER_UID:-1000}:${USER_GID:-1000}"

    restart: unless-stopped

    working_dir: /workspace

    environment:
      HOME: /home/developer

      BEADS_DIR: /workspace/.beads

      LLM_API_KEY: ${LLM_API_KEY:-}

      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Developer}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-developer@local}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-Developer}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-developer@local}

      # Your existing external Gitea
      GITEA_URL: ${GITEA_URL}

      # SSH key used for git access to Gitea.
      #
      # SSH_GITEA_KEY points at the PRIVATE key on the host (default
      # ~/.ssh/gitea). Its .pub half is registered in Gitea. Only this
      # single file is mounted, read-only.
      #
      # "accept-new" pins Gitea's host key on first connect (TOFU);
      # afterwards it is verified from /home/developer/.ssh/known_hosts.
      GIT_SSH_COMMAND: "ssh -i /home/developer/.ssh/gitea -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

    volumes:
      - ./workspace:/workspace
      - ${SSH_GITEA_KEY:-${HOME}/.ssh/gitea}:/home/developer/.ssh/gitea:ro

    tty: true
    stdin_open: true

    command:
      - /bin/bash
      - -lc
      - |
        echo "Development environment ready"
        echo
        echo "Beads:"
        bd version || true
        echo
        echo "Git:"
        git --version
        echo
        echo "Workspace:"
        ls -la /workspace
        exec sleep infinity

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - beads-net

  beads-ui:
    build:
      context: ./beads-ui
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        NPM_AUDIT_LEVEL: ${NPM_AUDIT_LEVEL:-high}
        BEADS_UI_REF: ${BEADS_UI_REF:-main}

    container_name: beads-ui
    restart: unless-stopped

    working_dir: /workspace

    environment:
      HOME: /home/developer
      BEADS_DIR: /workspace/.beads
      BD_BIN: /usr/local/bin/bd
      HOST: 0.0.0.0
      PORT: 3007

    ports:
      - "3007:3007"

    volumes:
      - ./workspace:/workspace

    networks:
      - beads-net


volumes:
  dev-home:
  beads-web-home:


networks:
  beads-net:
    driver: bridge
