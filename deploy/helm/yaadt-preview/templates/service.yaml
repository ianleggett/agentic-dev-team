apiVersion: v1
kind: Service
metadata:
  name: {{ include "yaadt-preview.fullname" . }}
  labels:
    {{- include "yaadt-preview.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "yaadt-preview.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.container.portName }}
      protocol: TCP
